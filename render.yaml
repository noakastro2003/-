# Render Blueprint for the learning-paths app (https://render.com/docs/blueprint-spec).
# A persistent disk keeps the SQLite database across deploys and restarts;
# disks need a paid instance type, so the free plan would lose all data.
services:
  - type: web
    name: learning-paths
    runtime: node
    plan: starter
    rootDir: learning-paths
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/app.db
      # Enables the AI path generator. Render asks for the value on first deploy.
      - key: ANTHROPIC_API_KEY
        sync: false
