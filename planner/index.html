<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="הכיתה שלי">
  <title>הכיתה שלי</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-row">
        <div>
          <div class="hello" id="hello"></div>
          <div class="sub" id="subhello"></div>
        </div>
        <div class="week-pill" id="weekPill"></div>
      </div>
    </header>

    <main id="view"></main>

    <nav class="tabs" id="tabs">
      <button data-tab="now"><span class="ti">✨</span><span>עכשיו</span></button>
      <button data-tab="day"><span class="ti">📅</span><span>השבוע</span></button>
      <button data-tab="prep"><span class="ti">✂️</span><span>להכין</span></button>
      <button data-tab="more"><span class="ti">🌸</span><span>עוד</span></button>
    </nav>
  </div>

  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  <div id="toast" class="toast" role="status"></div>
  <div id="confetti" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
