<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="sbar">
  <script>
    // iPhone reads the status-bar style only at launch: in night mode let the app paint behind it
    try {
      var p = (JSON.parse(localStorage.getItem('noa-planner-v1')) || {}).prefs || {};
      var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) { document.getElementById('sbar').content = 'black-translucent'; document.documentElement.dataset.theme = 'dark'; }
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-title" content="הכיתה שלי">
  <title>הכיתה שלי</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/rubik-hebrew-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/heebo-hebrew-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>
  </div>
  <nav class="tabs" id="tabs">
    <span class="tab-ind"></span>
    <button data-tab="now"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg><span>עכשיו</span></button>
    <button data-tab="day"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span>השבוע</span></button>
    <button data-tab="prep"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8 12.3l2.8 2.8L16.2 9"/></svg><span>להכין</span></button>
    <button data-tab="files"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.2A2.2 2.2 0 0 1 5.7 5h3.6l2.2 2.5h6.8a2.2 2.2 0 0 1 2.2 2.2v8.1a2.2 2.2 0 0 1-2.2 2.2H5.7a2.2 2.2 0 0 1-2.2-2.2z"/></svg><span>קבצים</span></button>
    <button data-tab="more"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5.5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="18.5" cy="12" r="1.5" fill="currentColor"/></svg><span>עוד</span></button>
  </nav>
  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  <input type="file" id="upfile" multiple hidden>
  <div id="toast" class="toast" role="status"></div>
  <div id="confetti" aria-hidden="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
