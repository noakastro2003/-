<script>
/* the host adds a floating "Powered by Netlify" badge: remove it whenever it appears */
(function () {
  var ours = { space: 1, sky: 1, toast: 1, fx: 1 };
  function hosted(el) {
    if (!el || el.nodeType !== 1 || ours[el.id] || el.classList.contains("app") || el.tagName === "SCRIPT") return false;
    var txt = (el.textContent || "") + (el.shadowRoot ? el.shadowRoot.textContent || "" : "") + (el.getAttribute("href") || "") + (el.getAttribute("src") || "") + (el.id || "") + (el.className && el.className.baseVal === undefined ? el.className : "");
    return /netlify/i.test(txt);
  }
  function sweep() { Array.prototype.forEach.call(document.body.children, function (el) { if (hosted(el)) el.remove(); }); Array.prototype.forEach.call(document.querySelectorAll('a[href*="netlify"],iframe[src*="netlify"]'), function (el) { el.remove(); }); }
  new MutationObserver(sweep).observe(document.documentElement, { childList: true, subtree: true });
  sweep(); addEventListener("load", sweep); setTimeout(sweep, 1500); setTimeout(sweep, 5000);
})();
</script>
