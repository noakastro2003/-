<title>מסע הקריאה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&family=Rubik:wght@400;500;700&display=swap">
<style>
@font-face { font-family: "Noa Bubble"; src: url("fonts/NoaBubble-Regular.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Noa Hand"; src: url("fonts/NoaHandwriting-Regular.otf") format("opentype"); font-display: swap; }

/* Layout: a notebook page (blue ruled lines, red margin on the right) laid on a desk.
   Home = a numbered trail of stations; a station = reading text beside one question card. */
:root {
  --desk: #E7EEF8;
  --paper: #FBFDFF;
  --rule: #DCE7F5;
  --margin: #F1B4B4;
  --ink: #1D2948;
  --ink-soft: #56627F;
  --pen: #2F6FD0;
  --pen-soft: #E3EDFC;
  --star: #F6B91C;
  --star-soft: #FFF3CF;
  --good: #23885C;
  --good-soft: #DDF4E9;
  --oops: #CF5B4C;
  --oops-soft: #FCE7E3;
  --hl: #FFE58A;
  --owl: #8A6A4F;
  --owl-belly: #E9D6BF;
  --card: #FFFFFF;
  --line: #D3DCEA;
  --f-display: "Noa Bubble", "Rubik", "Noto Sans Hebrew", Arial, sans-serif;
  --f-read: "Noto Sans Hebrew", Arial, sans-serif;
  --f-ui: "Rubik", "Noto Sans Hebrew", Arial, sans-serif;
  --f-hand: "Noa Hand", "Rubik", Arial, sans-serif;
  --read-size: 1.35rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #0E1729; --paper: #15213A; --rule: #1F2E4E; --margin: #6A3442;
  --ink: #EAF0FF; --ink-soft: #A7B4D3; --pen: #82B4FF; --pen-soft: #1F3359;
  --star: #FFCE4A; --star-soft: #3A3218; --good: #52C994; --good-soft: #163A2C;
  --oops: #FF8C7B; --oops-soft: #44221E; --hl: #6B5A12; --owl: #B58E6C; --owl-belly: #E2CBAE;
  --card: #1B2A47; --line: #2C3E62; color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #0E1729; --paper: #15213A; --rule: #1F2E4E; --margin: #6A3442;
  --ink: #EAF0FF; --ink-soft: #A7B4D3; --pen: #82B4FF; --pen-soft: #1F3359;
  --star: #FFCE4A; --star-soft: #3A3218; --good: #52C994; --good-soft: #163A2C;
  --oops: #FF8C7B; --oops-soft: #44221E; --hl: #6B5A12; --owl: #B58E6C; --owl-belly: #E2CBAE;
  --card: #1B2A47; --line: #2C3E62; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--desk); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.5; }
.app { max-width: 1120px; margin: 0 auto; padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { position: relative; background-color: var(--paper); border-radius: 6px; padding: 20px 20px 28px; padding-inline-start: 34px;
  background-image: linear-gradient(to left, transparent 22px, var(--margin) 22px, var(--margin) 24px, transparent 24px),
    repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px);
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(20, 40, 80, .35); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.brand, .hero h1, .intro h2, .parents h2, .summary h2 { -webkit-text-stroke: 1.2px currentColor; }
.bar .brand { font-family: var(--f-display); font-size: 1.9rem; line-height: 1; margin-inline-end: auto; background: none; border: 0; padding: 4px 0; color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .92rem; color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.chip.star-count { border-color: var(--star); background: var(--star-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.btn { border: 0; border-radius: 14px; padding: 12px 22px; font-weight: 700; font-size: 1.08rem; background: var(--pen); color: var(--paper); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }
.btn.good { background: var(--good); }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* owl guide */
.guide { display: flex; gap: 14px; align-items: flex-start; }
.guide svg { flex: 0 0 64px; width: 64px; height: 64px; }
.bubble { position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 16px; min-width: 0; flex: 1; }
.bubble p { margin: 0; }
.bubble p + p { margin-top: 6px; }

/* home */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; margin-bottom: 22px; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.4rem, 7vw, 3.8rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.hero p { margin: 6px 0 0; color: var(--ink-soft); font-size: 1.05rem; max-width: 52ch; }
.name-field { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.name-field input { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 1.1rem; width: 12em; max-width: 100%; }
.trail { position: relative; display: grid; gap: 18px; padding: 8px 0; list-style: none; margin: 0; }
.trail::before { content: ""; position: absolute; inset-block: 30px; inset-inline-start: 50%; border-inline-start: 4px dashed var(--line); }
.stop { position: relative; display: flex; align-items: center; gap: 14px; width: min(100%, 470px); background: var(--card); border: 2px solid var(--line);
  border-radius: 22px; padding: 12px 14px; text-align: start; color: var(--ink); }
.trail li:nth-child(odd) .stop { justify-self: start; margin-inline-start: 0; }
.trail li { display: grid; }
.trail li:nth-child(odd) { justify-items: start; }
.trail li:nth-child(even) { justify-items: end; }
.stop .num { flex: 0 0 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.4rem; background: var(--pen-soft); color: var(--pen); border: 2px solid var(--pen); }
.stop .meta { min-width: 0; flex: 1; }
.stop .t { font-family: var(--f-read); font-weight: 800; font-size: 1.2rem; display: block; }
.stop .s { color: var(--ink-soft); font-size: .92rem; display: block; }
.stop .stars { flex: 0 0 auto; font-size: 1.25rem; letter-spacing: 2px; color: var(--line); }
.stop .stars .on { color: var(--star); }
.stop.done { border-color: var(--good); }
.stop.done .num { background: var(--good); color: var(--paper); border-color: var(--good); }
.stop.next { border-color: var(--pen); box-shadow: 0 0 0 5px var(--pen-soft); }
.stop.locked { opacity: .55; cursor: not-allowed; }
.stop.locked .num { background: var(--card); color: var(--ink-soft); border-color: var(--line); }
.stop.test .num { background: var(--star-soft); border-color: var(--star); color: var(--ink); }
.home-foot { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.cert { margin-top: 22px; border: 3px double var(--star); border-radius: 18px; padding: 18px; text-align: center; background: var(--star-soft); }
.cert .hand { font-family: var(--f-hand); font-size: 2.2rem; line-height: 1.3; }

/* station */
.crumbs { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.crumbs h2 { font-family: var(--f-read); font-size: 1.35rem; margin: 0; margin-inline-end: auto; }
.dots { display: flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
.dots i.cur { background: var(--pen); transform: scale(1.25); }
.dots i.ok { background: var(--good); }
.dots i.miss { background: var(--star); }
.play { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .play { grid-template-columns: minmax(0, 1fr); } }
.reading { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px 20px; max-height: calc(100vh - 40px); overflow: auto; }
@media (max-width: 860px) { .reading { position: static; max-height: none; } }
.reading h3 { font-family: var(--f-read); font-weight: 800; font-size: calc(var(--read-size) * 1.15); margin: 0 0 8px; text-align: center; }
.reading .kind { display: block; text-align: center; color: var(--ink-soft); font-size: .85rem; letter-spacing: .02em; margin-bottom: 6px; }
.txt { font-family: var(--f-read); font-size: var(--read-size); line-height: 2.15; max-width: 60ch; }
.txt p { margin: 0 0 .4em; }
.sen { border-radius: 6px; padding: 2px 1px; transition: background-color .25s; }
.sen.hl { background: var(--hl); box-shadow: 0 0 0 3px var(--hl); }
.findable .sen { cursor: pointer; text-decoration: underline dotted var(--ink-soft); text-underline-offset: 6px; }
.findable .sen:hover { background: var(--pen-soft); }
.sen.picked { background: var(--pen-soft); box-shadow: 0 0 0 3px var(--pen); }
.qcard { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
.qtag { display: inline-flex; align-self: start; justify-self: start; gap: 6px; font-size: .82rem; padding: 3px 10px; border-radius: 999px; background: var(--pen-soft); color: var(--pen); font-weight: 600; }
.qtext { font-family: var(--f-read); font-weight: 600; font-size: calc(var(--read-size) * 1.05); line-height: 1.9; margin: 0; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: start; border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 10px 14px; font-family: var(--f-read); font-size: var(--read-size); line-height: 1.8; color: var(--ink); }
.opt .k { flex: 0 0 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font-family: var(--f-ui); font-size: 1rem; font-weight: 700; }
.opt:hover { border-color: var(--pen); }
.opt.sel { border-color: var(--pen); background: var(--pen-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); border-color: var(--good); color: var(--paper); }
.opt.wrong { border-color: var(--oops); background: var(--oops-soft); }
.opt[disabled] { cursor: default; }
.feedback { border-radius: 14px; padding: 12px 14px; font-size: 1.05rem; line-height: 1.7; }
.feedback.good { background: var(--good-soft); border: 1.5px solid var(--good); }
.feedback.try { background: var(--star-soft); border: 1.5px solid var(--star); }
.feedback.info { background: var(--pen-soft); border: 1.5px solid var(--pen); }
.feedback b { font-family: var(--f-read); }
.feedback .r { font-family: var(--f-read); }
.order-zone { display: grid; gap: 8px; }
.order-zone .lbl { font-size: .9rem; color: var(--ink-soft); }
.slot { display: flex; gap: 10px; align-items: center; min-height: 52px; border: 2px dashed var(--line); border-radius: 14px; padding: 6px 10px; background: var(--paper); font-family: var(--f-read); font-size: calc(var(--read-size) * .92); line-height: 1.7; }
.slot .n { flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--pen-soft); color: var(--pen); font-family: var(--f-ui); font-weight: 700; }
.slot button { flex: 1; text-align: start; background: none; border: 0; padding: 4px; font: inherit; }
.slot.filled { border-style: solid; border-color: var(--pen); }
.slot.right { border-color: var(--good); background: var(--good-soft); }
.slot.wrong { border-color: var(--oops); background: var(--oops-soft); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.pool button { border: 2px solid var(--pen); background: var(--card); border-radius: 12px; padding: 8px 12px; font-family: var(--f-read); font-size: calc(var(--read-size) * .9); line-height: 1.7; text-align: start; }
textarea { width: 100%; min-height: 130px; border: 2px solid var(--line); border-radius: 14px; padding: 12px; background: var(--paper);
  font-family: var(--f-read); font-size: var(--read-size); line-height: 1.9; resize: vertical; }
.checklist { display: grid; gap: 8px; }
.checklist label { display: flex; gap: 10px; align-items: center; font-size: 1.02rem; }
.checklist input { width: 22px; height: 22px; accent-color: var(--good); }
.model { font-family: var(--f-read); font-size: var(--read-size); line-height: 1.9; border-inline-start: 4px solid var(--good); padding-inline-start: 12px; }
.speak { border: 1.5px solid var(--line); background: var(--paper); border-radius: 50%; width: 40px; height: 40px; display: inline-grid; place-items: center; flex: 0 0 40px; color: var(--ink); }
.speak svg { width: 20px; height: 20px; }
.qhead { display: flex; gap: 10px; align-items: flex-start; }
.qhead .qtext { flex: 1; min-width: 0; }

/* intro + summary */
.intro { display: grid; gap: 18px; max-width: 760px; margin: 0 auto; }
.intro h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 6vw, 3rem); margin: 0; line-height: 1.15; text-wrap: balance; }
.toolbox { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.toolbox h3 { margin: 0 0 8px; font-size: 1.05rem; color: var(--pen); }
.toolbox ol { margin: 0; padding-inline-start: 1.4em; font-family: var(--f-read); font-size: calc(var(--read-size) * .92); line-height: 1.9; }
.summary { display: grid; gap: 18px; max-width: 760px; margin: 0 auto; text-align: center; justify-items: center; }
.big-stars { font-size: 3.4rem; letter-spacing: 8px; color: var(--line); line-height: 1; }
.big-stars .on { color: var(--star); display: inline-block; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.big-stars .on:nth-child(2) { animation-delay: .18s; }
.big-stars .on:nth-child(3) { animation-delay: .36s; }
@keyframes pop { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
.stamp { font-family: var(--f-hand); font-size: clamp(2.4rem, 9vw, 3.6rem); color: var(--oops); transform: rotate(-6deg); border: 3px solid var(--oops); border-radius: 14px; padding: 2px 22px; line-height: 1.35; animation: pop .6s .5s cubic-bezier(.3,1.6,.5,1) both; }
.review { width: 100%; display: grid; gap: 10px; text-align: start; }
.review .it { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
.review .it.ok { border-inline-start: 6px solid var(--good); }
.review .it.miss { border-inline-start: 6px solid var(--star); }
.review .it.open { border-inline-start: 6px solid var(--pen); }
.review .q { font-family: var(--f-read); font-weight: 600; font-size: 1.1rem; line-height: 1.8; }
.review .a { font-family: var(--f-read); color: var(--ink-soft); line-height: 1.8; }

/* parents */
.parents { display: grid; gap: 22px; max-width: 820px; margin: 0 auto; font-size: 1.02rem; }
.parents h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 6vw, 2.8rem); margin: 0; }
.parents h3 { font-size: 1.25rem; margin: 0 0 8px; }
.parents section { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px 20px; }
.parents p { margin: 0 0 8px; max-width: 68ch; }
.parents ul, .parents ol { margin: 0; padding-inline-start: 1.3em; display: grid; gap: 6px; }
.skill-row { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) 4.5em; gap: 10px; align-items: center; padding: 6px 0; }
@media (max-width: 520px) { .skill-row { grid-template-columns: minmax(0, 1fr) 4.5em; } .skill-row .track { grid-column: 1 / -1; grid-row: 2; } }
.track { height: 14px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--good); border-radius: 999px; }
.track i.mid { background: var(--star); }
.track i.low { background: var(--oops); }
.pct { font-variant-numeric: tabular-nums; text-align: end; font-weight: 700; }
.pct.na { color: var(--ink-soft); font-weight: 400; font-size: .9rem; }
details { border-top: 1px solid var(--line); padding: 10px 0; }
details:first-of-type { border-top: 0; }
summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: 8px; }
.ask { font-family: var(--f-read); background: var(--pen-soft); border-radius: 10px; padding: 8px 12px; line-height: 1.8; }
.danger-zone { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.confirm { background: var(--oops-soft); border: 1.5px solid var(--oops); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toast { position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: fit-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; z-index: 20; }
@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; }
  .trail::before { inset-inline-start: 30px; }
  .trail li:nth-child(even) { justify-items: start; }
  .sheet { padding-inline: 14px; padding-inline-start: 30px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* instructions track */
.tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.tab { flex: 1 1 240px; min-width: 0; text-align: start; border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 12px 14px; color: var(--ink); display: grid; gap: 2px; }
.tab.on { border-color: var(--pen); box-shadow: 0 0 0 4px var(--pen-soft); }
.tab .tn { font-family: var(--f-read); font-weight: 800; font-size: 1.15rem; }
.tab .ts { font-size: .9rem; color: var(--ink-soft); }
.badge { display: inline-block; background: var(--star); color: #1D2948; border-radius: 999px; font-family: var(--f-read); font-size: .78rem; font-weight: 700; padding: 1px 10px; margin-inline-start: 8px; vertical-align: middle; }
.task { max-width: 820px; margin: 0 auto; }
.instr { display: flex; gap: 10px; align-items: flex-start; background: var(--star-soft); border: 2px solid var(--star); border-radius: 16px; padding: 10px 14px; }
.instr .lbl { display: block; font-size: .8rem; font-weight: 700; color: var(--ink-soft); }
.itext { font-family: var(--f-read); font-weight: 600; font-size: calc(var(--read-size) * 1.1); line-height: 2.1; margin: 0; }
.iw { border-radius: 8px; padding: 1px 3px; }
.iw.tap { cursor: pointer; border-bottom: 2px dotted var(--ink-soft); }
.iw.tap:hover { background: var(--pen-soft); }
.iw.v { background: var(--pen); color: var(--paper); border-bottom-color: transparent; }
.iw.n { background: var(--good); color: var(--paper); border-bottom-color: transparent; }
.lbl-s { display: block; font-size: .9rem; color: var(--ink-soft); margin: 4px 0 6px; }
.wait { opacity: .4; pointer-events: none; filter: grayscale(.5); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 7px 12px; font-family: var(--f-read); font-size: 1rem; color: var(--ink); }
.tool svg { width: 22px; height: 22px; flex: 0 0 22px; }
.tool.on { border-color: var(--pen); background: var(--pen-soft); color: var(--pen); box-shadow: 0 0 0 3px var(--pen-soft); }
.tool.clear { margin-inline-start: auto; border-style: dashed; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; margin-top: 10px; }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--line); }
.sw.on { box-shadow: 0 0 0 3px var(--ink); }
.swl { font-family: var(--f-read); font-size: .95rem; margin-inline-end: 12px; }
.board { position: relative; margin-top: 12px; padding: 22px 12px; border-radius: 16px; background: var(--paper); border: 1.5px dashed var(--line); }
.board.scene { padding: 8px; background: #FFFFFF; }
.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.tiles { display: flex; flex-wrap: wrap; gap: 22px 26px; justify-content: center; }
.tile { display: inline-block; cursor: pointer; font-family: var(--f-read); font-size: calc(var(--read-size) * 1.1); line-height: 1.8; padding: 2px 10px; border-radius: 10px; color: var(--ink); }
.tile:hover, .lt:hover { background: var(--pen-soft); }
.tiles.letters { gap: 18px; }
.tiles.letters .tile { font-size: calc(var(--read-size) * 1.6); font-weight: 600; min-width: 1.5em; text-align: center; }

      { type: "fill", skill: "lang", q: "הַעְתִּיקוּ מִמַּחְסַן הַמִּלִּים אֶת הַמִּלָּה הַחֲסֵרָה.", sentence: "שָׁכַחְתִּי אֶת הַמְּעִיל בַּבַּיִת, ___ הָיָה לִי קַר.", opts: ["לָכֵן", "מִפְּנֵי", "כְּדֵי", "לִפְנֵי"], why: "שָׁכַחְתִּי מְעִיל, וּבִגְלַל זֶה (לָכֵן) הָיָה לִי קַר." },
      { type: "punct", skill: "lang", q: "כִּתְבוּ נְקֻדָּה (.) אוֹ סִימַן שְׁאֵלָה (?) בַּסּוֹף שֶׁל כָּל מִשְׁפָּט.", lines: [{ t: "אֵיפֹה הַתִּיק שֶׁלִּי", a: "?" }, { t: "הַתִּיק עַל הַכִּסֵּא", a: "." }], why: "\"אֵיפֹה\" פּוֹתַחַת שְׁאֵלָה, וְלָכֵן בַּסּוֹף סִימַן שְׁאֵלָה. הַמִּשְׁפָּט הַשֵּׁנִי מְסַפֵּר, וּבַסּוֹף נְקֻדָּה." },
    ] },
];

const TRACKS = [
  { id: "h", name: "מַסְלוּל הַהוֹרָאוֹת", sub: "קוֹרְאִים הוֹרָאָה וְעוֹשִׂים בְּדִיּוּק מָה שֶׁבִּקְּשׁוּ", badge: "הֲכִי חָשׁוּב לַמִּבְדָּק", stations: H },
  { id: "r", name: "מַסְלוּל הַהֲבָנָה", sub: "קוֹרְאִים טֶקְסְט וְעוֹנִים עַל שְׁאֵלוֹת", stations: STATIONS },
];
const ALL = TRACKS.flatMap(t => t.stations);

/* ---------- state (kept in this browser only) ---------- */
const KEY = "reading-journey-v1";
const blank = () => ({ name: "", nikud: true, size: 1, sound: true, unlockAll: false, track: 0, st: {} });
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let view = { name: "home" };   // home | intro | play | summary | parents
let run = null;                // current station run: { t, i, qi, res, ans, open, q }
const ST = () => TRACKS[run.t].stations[run.i];

/* ---------- helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MARKS = /[֑-ׇֽֿׁׂׅׄ]/g;
const plain = s => String(s).replace(MARKS, "");
const tx = s => esc(S.nikud ? s : plain(s));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const LETTERS = ["א", "ב", "ג", "ד"];
const starsFor = r => r >= .9 ? 3 : r >= .6 ? 2 : 1;
const done = s => !!(S.st[s.id] && S.st[s.id].done);
const unlocked = (t, i) => S.unlockAll || i === 0 || done(TRACKS[t].stations[i - 1]);
const totalStars = () => ALL.reduce((n, s) => n + ((S.st[s.id] && S.st[s.id].stars) || 0), 0);
const isTask = q => ["mark", "build", "fill", "punct"].includes(q.type) || !!q.board;
const isChoice = q => q.type === "mc" || q.type === "fill";
const pick = a => a[Math.floor(Math.random() * a.length)];
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

const OWL = `<svg viewBox="0 0 64 64" aria-hidden="true">
  <path d="M14 14 L22 22 L18 26 Z M50 14 L42 22 L46 26 Z" fill="var(--owl)"/>
  <ellipse cx="32" cy="38" rx="21" ry="23" fill="var(--owl)"/>
  <ellipse cx="32" cy="45" rx="13" ry="14" fill="var(--owl-belly)"/>
  <circle cx="24" cy="30" r="8" fill="var(--paper)"/><circle cx="40" cy="30" r="8" fill="var(--paper)"/>
  <circle cx="25" cy="31" r="3.6" fill="var(--ink)"/><circle cx="39" cy="31" r="3.6" fill="var(--ink)"/>
  <path d="M29 37 L35 37 L32 42 Z" fill="var(--star)"/>
  <path d="M17 26 Q24 20 30 25 M34 25 Q40 20 47 26" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>`;
const SPEAK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;

/* sound + speech, both only after a tap */
let actx = null;
function chime(good) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [660, 880, 1175] : [392, 330];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * .11;
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.18, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .3);
      o.start(t0); o.stop(t0 + .32);
    });
  } catch (e) {}
}
function speak(text) {
  if (!("speechSynthesis" in window)) { toast("אין הקראה במכשיר הזה"); return; }
  const voices = speechSynthesis.getVoices();
  const he = voices.find(v => /^he|^iw/i.test(v.lang));
  if (voices.length && !he) { toast("אין קול בעברית במכשיר הזה"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "he-IL"; u.rate = .85; if (he) u.voice = he;
  speechSynthesis.speak(u);
}

/* ---------- top bar ---------- */
function bar() {
  return `<div class="bar">
    <button class="brand" data-go="home" aria-label="למפת המסע">${view.name === "home" ? "" : "מסע הקריאה"}</button>
    <span class="chip star-count" title="כוכבים שנאספו">★ ${totalStars()} / ${ALL.length * 3}</span>
    <button class="chip" data-act="nikud" aria-pressed="${S.nikud}">${S.nikud ? "נִקּוּד: כֵּן" : "ניקוד: לא"}</button>
    <button class="chip" data-act="size" aria-label="גודל אותיות">אותיות ${["רגילות", "גדולות", "ענקיות"][S.size - 1] || "רגילות"}</button>
    <button class="chip" data-act="sound" aria-pressed="${S.sound}">${S.sound ? "צלילים: כן" : "צלילים: לא"}</button>
    ${view.name !== "parents" ? `<button class="chip" data-go="parents">פינת ההורים</button>` : ""}
  </div>`;
}

/* ---------- home: two tracks, each a trail ---------- */
function renderHome() {
  const t = Math.min(S.track || 0, TRACKS.length - 1), T = TRACKS[t];
  const nextIdx = T.stations.findIndex((s, i) => unlocked(t, i) && !done(s));
  const allDone = ALL.every(done);
  const hello = S.name ? `שָׁלוֹם ${esc(S.name)}!` : "שָׁלוֹם!";
  return bar() + `
  <div class="hero">
    <div>
      <h1>מסע הקריאה</h1>
      <p>${tx("שְׁנֵי מַסְלוּלִים שֶׁמְּכִינִים אוֹתָנוּ לַמִּבְדָּק: בִּצּוּעַ הוֹרָאוֹת וַהֲבָנַת הַנִּקְרָא. בְּכָל תַּחֲנָה אוֹסְפִים כּוֹכָבִים.")}</p>
      <form class="name-field" id="nameForm">
        <label for="kidName">${tx("אֵיךְ קוֹרְאִים לְךָ?")}</label>
        <input id="kidName" maxlength="20" autocomplete="off" value="${esc(S.name)}" placeholder="השם שלי">
        <button class="btn ghost" type="submit">${tx("שְׁמֹר")}</button>
      </form>
    </div>
    <div class="guide" style="max-width:300px">${OWL}<div class="bubble"><p style="font-family:var(--f-read);font-size:1.1rem;line-height:1.8">${tx(hello)} ${tx(nextIdx === -1 ? "סִיַּמְתָּ אֶת הַמַּסְלוּל הַזֶּה!" : "בּוֹא נַמְשִׁיךְ לַתַּחֲנָה הַבָּאָה.")}</p></div></div>
  </div>
  <div class="tabs" role="tablist">
    ${TRACKS.map((tr, k) => {
      const d = tr.stations.filter(done).length;
      return `<button class="tab ${k === t ? "on" : ""}" role="tab" aria-selected="${k === t}" data-track="${k}">
        <span class="tn">${tx(tr.name)}${tr.badge ? `<span class="badge">${tx(tr.badge)}</span>` : ""}</span>
        <span class="ts">${tx(tr.sub)}</span><span class="ts">${d} / ${tr.stations.length} ${tx("תַּחֲנוֹת")}</span></button>`;
    }).join("")}
  </div>
  <ol class="trail">
    ${T.stations.map((s, i) => {
      const r = S.st[s.id] || {}, open = unlocked(t, i), stars = r.stars || 0;
      const cls = ["stop", r.done ? "done" : "", i === nextIdx ? "next" : "", open ? "" : "locked", s.test ? "test" : ""].join(" ");
      return `<li><button class="${cls}" data-station="${i}" ${open ? "" : 'aria-disabled="true"'}>
        <span class="num">${i + 1}</span>
        <span class="meta"><span class="t">${tx(s.title)}</span><span class="s">${tx(s.sub)}</span></span>
        <span class="stars" aria-label="${stars} כוכבים">${[1, 2, 3].map(k => `<span class="${k <= stars ? "on" : ""}">★</span>`).join("")}</span>
      </button></li>`;
    }).join("")}
  </ol>
  ${allDone ? `<div class="cert"><div class="hand">כל הכבוד${S.name ? " " + esc(S.name) : ""}!</div><p>${tx("סִיַּמְתָּ אֶת שְׁנֵי הַמַּסְלוּלִים וְאָסַפְתָּ")} ${totalStars()} ${tx("כּוֹכָבִים. אַתָּה מוּכָן לַמִּבְדָּק!")}</p></div>` : ""}
  <div class="home-foot">
    <span style="color:var(--ink-soft)">כל תחנה לוקחת 10 עד 15 דקות. מומלץ תחנה אחת ביום.</span>
    <button class="btn ghost" data-go="parents">להורים: איך לעזור בבית</button>
  </div>`;
}

/* ---------- station intro ---------- */
function renderIntro() {
  const s = ST();
  return bar() + `<div class="intro">
    <div class="crumbs"><span class="chip">${tx(TRACKS[run.t].name)}</span><span class="chip">${tx("תַּחֲנָה")} ${run.i + 1}</span></div>
    <h2>${esc(plain(s.title))}</h2>
    <div class="guide">${OWL}<div class="bubble">${s.owl.map(l => `<p style="font-family:var(--f-read);font-size:calc(var(--read-size)*.95);line-height:1.9">${tx(l)}</p>`).join("")}</div>

    <div class="row"><button class="btn" data-act="start">${tx("יוֹצְאִים לַדֶּרֶךְ")}</button><button class="btn ghost" data-go="home">${tx("חֲזָרָה לַמַּפָּה")}</button></div>
  </div>`;

/* ---------- reading text (comprehension track) ---------- */
function textFor(s, q) { return q.text ? { kind: "", title: "", paras: [q.text] } : s.text; }
function evMatch(sentence, ev) { return (ev || []).some(f => sentence.includes(f)); }

function renderText(s, q, st) {
  const T = textFor(s, q);
  let k = 0;
  const paras = T.paras.map(p => `<p>${p.map(sen => {
    const idx = k++;
    const hl = st.hint && evMatch(sen, q.ev) ? " hl" : "";
    const picked = st.picked === idx ? " picked" : "";
    const tap = q.type === "find" && !st.locked ? ' role="button" tabindex="0"' : "";
    return `<span class="sen${hl}${picked}" data-sen="${idx}"${tap}>${tx(sen)}</span>`;
  }).join(" ")}</p>`).join("");
  return `<article class="reading" id="reading">
    ${T.kind ? `<span class="kind">${tx(T.kind)}</span>` : ""}
    ${T.title ? `<h3>${tx(T.title)}</h3>` : ""}
    <div class="txt ${q.type === "find" && !st.locked ? "findable" : ""}">${paras}</div>
  </article>`;
}

/* ---------- per-question state ---------- */
function qStateNew(q, s) {
  const sc = (s && s.scaffold) || 0;
  return { tries: 0, locked: false, hint: false, sel: null, wrongs: [], picked: null,
    order: [], pool: q.type === "order" ? shuffle(q.items.map((_, i) => i)) : [], marks: [],
    opts: isChoice(q) ? shuffle(q.opts.map((_, i) => i)) : [], text: "", checked: [], showModel: false,
    // instruction tasks
    stage: sc >= 1 && q.verb ? "verb" : "do", needNum: sc >= 2 && !!q.num, foundV: [], foundN: null, stageMsg: null,
    tool: null, color: null, pending: null, bad: null, reveal: false, fbMsg: null, msg: null,
    bank: q.type === "build" ? shuffle(q.bank.map((_, i) => i)) : [], slots: [],
    p: q.type === "punct" ? q.lines.map(() => "") : [], pmarks: null };
}

/* ---------- play ---------- */
function renderPlay() {
  const s = ST(), q = s.questions[run.qi], st = run.q;
  const dots = s.questions.map((qq, i) => {
    const r = run.res[i];
    return `<i class="${i === run.qi ? "cur" : r === true ? "ok" : r === false ? (s.test ? "ok" : "miss") : r === "open" ? "ok" : ""}"></i>`;
  }).join("");
  const head = `<div class="crumbs"><h2>${tx(s.title)}</h2><span class="chip">${tx("שְׁאֵלָה")} ${run.qi + 1} ${tx("מִתּוֹךְ")} ${s.questions.length}</span><div class="dots" aria-hidden="true">${dots}</div></div>`;
  if (isTask(q) || !(q.text || s.text)) return bar() + head + `<div class="task"><section class="qcard" aria-live="polite">${renderTask(s, q, st)}</section></div>`;
  return bar() + head + `
  <div class="play">
    ${renderText(s, q, st)}
    <section class="qcard" aria-live="polite">
      <span class="qtag">${tx(SKILLS[q.skill].kid)}</span>
      <div class="qhead"><p class="qtext">${tx(q.q)}</p><button class="speak" data-say="${esc(q.q + (q.type === "mc" ? " " + st.opts.map(o => q.opts[o]).join(". ") : ""))}" aria-label="הקראת השאלה">${SPEAK}</button></div>
      ${renderAnswer(s, q, st)}
    </section>
  </div>`;
}

const nextLabel = s => run.qi + 1 < s.questions.length ? tx("לַשְּׁאֵלָה הַבָּאָה") : tx("לְסִיּוּם הַתַּחֲנָה");

function renderAnswer(s, q, st) {
  const nextBtn = `<button class="btn" data-act="next">${nextLabel(s)}</button>`;
  if (q.type === "mc") {
    const opts = st.opts.map((oi, k) => {
      let c = "opt";
      if (s.test) { if (st.sel === oi) c += " sel"; }
      else if (st.locked && oi === 0) c += " right";
      else if (st.wrongs.includes(oi)) c += " wrong";
      return `<button class="${c}" data-opt="${oi}" ${st.locked || st.wrongs.includes(oi) ? "disabled" : ""}><span class="k">${LETTERS[k]}</span><span>${tx(q.opts[oi])}</span></button>`;
    }).join("");
    if (s.test) return `<div class="opts">${opts}</div><div class="row"><button class="btn" data-act="testnext" ${st.sel === null ? "disabled" : ""}>${tx("הַמְשֵׁךְ")}</button></div>`;
    return `<div class="opts">${opts}</div>${feedback(q, st)}${st.locked ? `<div class="row">${nextBtn}</div>` : ""}`;
  }
  if (q.type === "find") {
    const picked = st.picked !== null ? textFor(s, q).paras.flat()[st.picked] : null;
    return `<div class="feedback info">${tx("גְּעוּ בַּמִּשְׁפָּט בַּטֶּקְסְט.")} ${picked ? `<br>${tx("בְּחַרְתֶּם:")} <span class="r">${tx(picked)}</span>` : ""}</div>
      ${st.locked ? "" : `<div class="row"><button class="btn" data-act="checkfind" ${st.picked === null ? "disabled" : ""}>${tx("בְּדִיקָה")}</button></div>`}
      ${feedback(q, st)}${st.locked ? `<div class="row">${nextBtn}</div>` : ""}`;
  }
  if (q.type === "order") {
    const slots = q.items.map((_, k) => {
      const it = st.order[k];
      const mark = st.marks && st.marks[k] !== undefined ? (st.marks[k] ? " right" : " wrong") : "";
      return `<div class="slot${it !== undefined ? " filled" : ""}${mark}"><span class="n">${k + 1}</span>${it !== undefined ? `<button data-unorder="${k}" ${st.locked ? "disabled" : ""}>${tx(q.items[it])}</button>` : ""}</div>`;
    }).join("");
    const pool = st.pool.map(i => `<button data-order="${i}">${tx(q.items[i])}</button>`).join("");
    const full = st.order.filter(x => x !== undefined).length === q.items.length;
    return `<div class="order-zone"><span class="lbl">${tx("גְּעוּ בַּכַּרְטִיסִים לְפִי הַסֵּדֶר:")}</span>${pool ? `<div class="pool">${pool}</div>` : ""}${slots}</div>
      ${st.locked ? "" : `<div class="row"><button class="btn" data-act="${s.test ? "testnext" : "checkorder"}" ${full ? "" : "disabled"}>${s.test ? tx("הַמְשֵׁךְ") : tx("בְּדִיקָה")}</button></div>`}
      ${s.test ? "" : feedback(q, st)}${st.locked && !s.test ? `<div class="row">${nextBtn}</div>` : ""}`;
  }
  if (q.type === "open") {
    const ta = `<label for="ans-${s.id}-${run.qi}" style="color:var(--ink-soft)">${tx("הַתְּשׁוּבָה שֶׁלִּי:")}</label><textarea id="ans-${s.id}-${run.qi}" data-input="open" ${st.showModel ? "readonly" : ""}>${esc(st.text)}</textarea>`;
    if (s.test) return `${ta}<div class="row"><button class="btn" data-act="testnext" ${st.text.trim().length < 3 ? "disabled" : ""}>${tx("הַמְשֵׁךְ")}</button></div>`;
    if (!st.showModel) return `${ta}<div class="row"><button class="btn" data-act="openDone" ${st.text.trim().length < 3 ? "disabled" : ""}>${tx("סִיַּמְתִּי לִכְתֹּב")}</button></div>`;
    return `${ta}<div class="feedback info"><b>${tx("בּוֹדְקִים יַחַד (עִם אַבָּא אוֹ אִמָּא):")}</b>
      <div class="checklist" style="margin-top:8px">${q.check.map((c, k) => `<label><input type="checkbox" data-check="${k}" ${st.checked.includes(k) ? "checked" : ""}>${tx(c)}</label>`).join("")}</div></div>
      <div class="feedback good"><b>${tx("תְּשׁוּבָה לְדֻגְמָה:")}</b><div class="model" style="margin-top:6px">${tx(q.model)}</div>
      <div style="margin-top:6px;font-size:.95rem">${tx("יֵשׁ עוֹד הַרְבֵּה תְּשׁוּבוֹת נְכוֹנוֹת! הָעִקָּר: מִשְׁפָּט שָׁלֵם וְהֶסְבֵּר.")}</div></div>
      <div class="row">${nextBtn}</div>`;
  }
  return "";
}

function feedback(q, st) {
  if (st.locked && st.tries === 1) return `<div class="feedback good"><b>${tx(pick(["מְצֻיָּן!", "נָכוֹן!", "כָּל הַכָּבוֹד!", "יָפֶה מְאוֹד!"]))}</b> <span class="r">${tx(q.why)}</span></div>`;
  if (st.locked) return `<div class="feedback info"><b>${tx(isTask(q) && q.type !== "fill" && q.type !== "mc" ? "כָּךְ עוֹשִׂים אֶת זֶה:" : "הַתְּשׁוּבָה הַנְּכוֹנָה מְסֻמֶּנֶת.")}</b> <span class="r">${tx(q.why)}</span></div>`;
  if (st.tries === 1) {
    if (st.fbMsg) return `<div class="feedback try"><b>${tx("כִּמְעַט!")}</b> ${tx(st.fbMsg)}</div>`;
    const where = q.ev && q.ev.length ? "סִמַּנְתִּי לְךָ בַּצָּהֹב אֶת הַמָּקוֹם בַּטֶּקְסְט. קְרָא שׁוּב וְנַסֵּה." : isTask(q) || !(q.text || ST().text) ? "קִרְאוּ שׁוּב אֶת הַהוֹרָאָה וְנַסּוּ שׁוּב." : "קְרָא שׁוּב אֶת הַטֶּקְסְט וְנַסֵּה שׁוּב.";
    const extra = q.type === "order" ? " הַכַּרְטִיסִים בַּיָּרֹק בַּמָּקוֹם. חַפֵּשׂ מִלּוֹת זְמַן." : "";
    return `<div class="feedback try"><b>${tx("כִּמְעַט!")}</b> ${tx(where + extra)}</div>`;
  }
  return "";
}

/* ---------- instruction tasks ---------- */
const TOOLS = {
  circle: { label: "עִגּוּל מִסָּבִיב", meaning: "עִגּוּל מִסָּבִיב (\"הַקִּיפוּ\")", icon: `<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>` },
  under: { label: "קַו מִתַּחַת", meaning: "קַו מִתַּחַת (\"מִתְחוּ קַו מִתַּחַת\")", icon: `<svg viewBox="0 0 24 24"><path d="M7 6v6M12 6v6M17 6v6" stroke="currentColor" stroke-width="1.6" opacity=".45"/><path d="M3 18h18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>` },
  x: { label: "סִימוּן X", meaning: "סִימוּן X (\"סַמְּנוּ X\")", icon: `<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>` },
  line: { label: "קַו מְחַבֵּר", meaning: "קַו מְחַבֵּר (\"מִתְחוּ קַו מִ... אֶל...\")", icon: `<svg viewBox="0 0 24 24"><circle cx="5" cy="17" r="2.5" fill="currentColor"/><circle cx="19" cy="7" r="2.5" fill="currentColor"/><path d="M5 17L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>` },
  color: { label: "צֶבַע", meaning: "צְבִיעָה (\"צִבְעוּ\")", icon: `<svg viewBox="0 0 24 24"><path d="M14 3l7 7-9 9H5v-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M5 19l4-4" stroke="currentColor" stroke-width="2"/></svg>` },
};
const TOOL_ORDER = ["circle", "under", "x", "line", "color"];
const COLORS = { red: { name: "אָדֹם", v: "#E5484D" }, yellow: { name: "צָהֹב", v: "#F5C518" }, blue: { name: "כָּחֹל", v: "#3B82F6" }, green: { name: "יָרֹק", v: "#22A55B" } };
const mkey = m => m.t === "line" ? "line:" + [m.id, m.id2].sort().join("|") : m.t === "color" ? "color:" + m.id + ":" + m.c : m.t + ":" + m.id;
const markOk = (q, marks) => { const exp = new Set(q.expect.map(mkey)); const got = marks.map(mkey); return got.length === exp.size && got.every(k => exp.has(k)); };

function diagnose(q, marks) {
  const exp = q.expect, expKeys = new Set(exp.map(mkey)), expTools = new Set(exp.map(m => m.t));
  if (!marks.length) return "עוֹד לֹא סִמַּנְתֶּם כְּלוּם.";
  if (marks.some(m => !expTools.has(m.t))) return `בַּהוֹרָאָה בִּקְּשׁוּ: ${[...expTools].map(t => TOOLS[t].meaning).join(" וְגַם ")}. בִּדְקוּ שׁוּב אֶת מִלַּת הַפְּעֻלָּה.`;
  if (marks.some(m => m.t === "color" && exp.some(e => e.t === "color" && e.id === m.id && e.c !== m.c))) return "שִׂימוּ לֵב לַצֶּבַע שֶׁבִּקְּשׁוּ בַּהוֹרָאָה.";
  if (expTools.size > 1) {
    const did = new Set(marks.filter(m => expKeys.has(mkey(m))).map(m => m.t));
    if (did.size < expTools.size) return "עֲשִׂיתֶם רַק חֵלֶק. בַּהוֹרָאָה יֵשׁ שְׁנֵי דְּבָרִים לַעֲשׂוֹת.";
  }
  if (exp.length > 1 && marks.length !== exp.length) return `בַּהוֹרָאָה בִּקְּשׁוּ ${exp.length}, וְסִמַּנְתֶּם ${marks.length}. לֹא יוֹתֵר וְלֹא פָּחוֹת!`;
  if (exp.length === 1 && marks.length > 1) return "בִּקְּשׁוּ לְסַמֵּן רַק דָּבָר אֶחָד.";
  return q.hint || "יֵשׁ סִימוּן שֶׁלֹּא בַּמָּקוֹם הַנָּכוֹן. קִרְאוּ שׁוּב אֶת הַהוֹרָאָה.";
}

function renderInstr(q, st) {
  const words = q.q.split(" ");
  const tapping = st.stage === "verb" || st.stage === "num";
  const body = words.map((w, k) => {
    const c = ["iw", tapping ? "tap" : "", st.foundV.includes(k) ? "v" : "", st.foundN === k ? "n" : ""].join(" ");
    return `<span class="${c}" data-iw="${k}"${tapping ? ' role="button" tabindex="0"' : ""}>${tx(w)}</span>`;
  }).join(" ");
  return `<div class="instr"><div style="flex:1;min-width:0"><span class="lbl">${tx("הוֹרָאָה")}</span><p class="itext">${body}</p></div>
    <button class="speak" data-say="${esc(q.q)}" aria-label="הקראת ההוראה">${SPEAK}</button></div>`;
}

function stageHint(q, st) {
  if (st.stage === "verb") {
    const ask = q.verb.length > 1 ? `מָה צָרִיךְ לַעֲשׂוֹת? בַּהוֹרָאָה הַזֹּאת יֵשׁ ${q.verb.length} מִלּוֹת פְּעֻלָּה. גְּעוּ בְּכֻלָּן.` : "מָה צָרִיךְ לַעֲשׂוֹת? גְּעוּ בְּמִלַּת הַפְּעֻלָּה בַּהוֹרָאָה.";
    const bad = st.stageMsg === "bad" ? `<br>${tx("לֹא זוֹ. מִלַּת הַפְּעֻלָּה אוֹמֶרֶת מָה לַעֲשׂוֹת, כְּמוֹ: הַקִּיפוּ, סַמְּנוּ, כִּתְבוּ.")}` : "";
    const more = st.foundV.length ? `<br>${tx("יָפֶה! יֵשׁ עוֹד אַחַת.")}` : "";
    return `<div class="feedback ${st.stageMsg === "bad" ? "try" : "info"}"><b>${tx("שָׁלָב 1:")}</b> ${tx(ask)}${bad}${more}</div>`;
  }
  if (st.stage === "num") return `<div class="feedback ${st.stageMsg === "bad" ? "try" : "info"}"><b>${tx("שָׁלָב 2:")}</b> ${tx("יָפֶה! וְעַכְשָׁו: כַּמָּה? גְּעוּ בַּמִּלָּה שֶׁאוֹמֶרֶת כַּמָּה.")}${st.stageMsg === "bad" ? `<br>${tx("לֹא זוֹ. חַפְּשׂוּ מִלָּה שֶׁל מִסְפָּר.")}` : ""}</div>`;
  return "";
}

function tapInstrWord(k) {
  const q = ST().questions[run.qi], st = run.q, w = q.q.split(" ")[k];
  if (st.stage === "verb") {
    const hit = q.verb.some(v => w.includes(v)) && !st.foundV.includes(k);
    if (hit) { st.foundV.push(k); st.stageMsg = null; chime(true);
      if (st.foundV.length >= q.verb.length) st.stage = st.needNum ? "num" : "do"; }
    else if (!st.foundV.includes(k)) { st.stageMsg = "bad"; chime(false); }
  } else if (st.stage === "num") {
    if (w.includes(q.num)) { st.foundN = k; st.stage = "do"; st.stageMsg = null; chime(true); }
    else { st.stageMsg = "bad"; chime(false); }
  }
  draw();
}

function renderTask(s, q, st) {
  const tag = `<span class="qtag">${tx(SKILLS[q.skill].kid)}</span>`;
  const wait = st.stage !== "do" ? " wait" : "";
  const nextBtn = `<button class="btn" data-act="next">${nextLabel(s)}</button>`;
  const after = s.test ? "" : `${feedback(q, st)}${st.locked ? `<div class="row">${nextBtn}</div>` : ""}`;
  let body = "";
  if (q.type === "mc" || q.type === "fill") {
    const board = q.board ? renderBoard(q, st, false) : "";
    let sentence = "";
    if (q.type === "fill") {
      const [a, b] = q.sentence.split("___");
      const shown = s.test ? (st.sel !== null ? q.opts[st.sel] : "") : st.locked ? q.opts[0] : "";
      sentence = `<p class="fill-sent">${tx(a)}<span class="blank${!s.test && st.locked ? " ok" : ""}">${shown ? tx(shown) : "&nbsp;"}</span>${tx(b)}</p>`;
    }
    const opts = st.opts.map((oi, k) => {
      let c = q.type === "fill" ? "chip-o" : "opt";
      if (s.test) { if (st.sel === oi) c += " sel"; }
      else if (st.locked && oi === 0) c += " right";
      else if (st.wrongs.includes(oi)) c += " wrong";
      const inner = q.type === "fill" ? tx(q.opts[oi]) : `<span class="k">${LETTERS[k]}</span><span>${tx(q.opts[oi])}</span>`;
      return `<button class="${c}" data-opt="${oi}" ${st.locked || st.wrongs.includes(oi) ? "disabled" : ""}>${inner}</button>`;
    }).join("");
    body = `${board}${sentence}${q.type === "fill" ? `<span class="lbl-s">${tx("מַחְסַן מִלִּים:")}</span><div class="chips">${opts}</div>` : `<div class="opts">${opts}</div>`}
      ${s.test ? `<div class="row"><button class="btn" data-act="testnext" ${st.sel === null ? "disabled" : ""}>${tx("הַמְשֵׁךְ")}</button></div>` : after}`;
    return tag + (q.type === "fill" ? renderInstr(q, st) : `<div class="qhead"><p class="qtext">${tx(q.q)}</p><button class="speak" data-say="${esc(q.q)}" aria-label="הקראת השאלה">${SPEAK}</button></div>`) + body;
  }
  if (q.type === "mark") {
    const tools = TOOL_ORDER.map(t => `<button class="tool ${st.tool === t ? "on" : ""}" data-tool="${t}" ${st.locked ? "disabled" : ""}>${TOOLS[t].icon}<span>${tx(TOOLS[t].label)}</span></button>`).join("");
    const sw = st.tool === "color" ? `<div class="swatches">${Object.entries(COLORS).map(([k, c]) => `<button class="sw ${st.color === k ? "on" : ""}" data-color="${k}" style="background:${c.v}" aria-label="${c.name}" title="${c.name}"></button><span class="swl">${tx(c.name)}</span>`).join("")}</div>` : "";
    const pickMsg = st.msg === "pick" ? `<div class="feedback try">${tx("קֹדֶם בּוֹחֲרִים כְּלִי: מָה הַהוֹרָאָה מְבַקֶּשֶׁת לַעֲשׂוֹת?")}</div>`
      : st.msg === "pickColor" ? `<div class="feedback try">${tx("בַּחֲרוּ צֶבַע.")}</div>` : "";
    const canGo = st.marks.length > 0;
    body = `<div class="${wait.trim()}">
        <span class="lbl-s">${tx("בַּחֲרוּ כְּלִי:")}</span>
        <div class="tools" role="toolbar">${tools}${st.locked ? "" : `<button class="tool clear" data-act="clearMarks">${tx("מְחִיקָה")}</button>`}</div>${sw}
        ${pickMsg}
        ${renderBoard(q, st, !st.locked)}
      </div>
      ${st.locked || st.stage !== "do" ? "" : `<div class="row"><button class="btn" data-act="${s.test ? "testnext" : "checkmark"}" ${canGo ? "" : "disabled"}>${s.test ? tx("הַמְשֵׁךְ") : tx("בְּדִיקָה")}</button></div>`}
      ${after}`;
    return tag + renderInstr(q, st) + stageHint(q, st) + body;
  }
  if (q.type === "build") {
    const sent = q.sentence ? `<p class="fill-sent">${q.sentence.split(" ").map(w => `<span class="${st.hint && q.hintWord && w.includes(q.hintWord) ? "sen hl" : ""}">${tx(w)}</span>`).join(" ")}</p>` : "";
    const used = new Set(st.slots);
    const bank = st.bank.map(i => `<button data-bk="${i}" ${used.has(i) || st.locked ? "disabled" : ""}>${esc(q.bank[i])}</button>`).join("");
    const slots = q.word.split("").map((_, k) => {
      const i = st.slots[k];
      return `<button class="sl" data-bs="${k}" ${i === undefined || st.locked ? "disabled" : ""}>${i !== undefined ? esc(q.bank[i]) : ""}</button>`;
    }).join("");
    const full = st.slots.filter(x => x !== undefined).length === q.word.length;
    body = `<div class="${wait.trim()}">${sent}
        <span class="lbl-s">${tx(q.sentence ? "מַחְסַן אוֹתִיּוֹת. גְּעוּ בָּאוֹתִיּוֹת לְפִי הַסֵּדֶר:" : "מַחְסַן הָאוֹתִיּוֹת. גְּעוּ בָּאוֹתִיּוֹת לְפִי הַסֵּדֶר:")}</span>
        <div class="bank">${bank}</div>
        <span class="lbl-s">${tx("הַמִּלָּה שֶׁלִּי:")}</span>
        <div class="slots" dir="rtl">${slots}</div>
      </div>
      ${st.locked || st.stage !== "do" ? "" : `<div class="row"><button class="btn" data-act="${s.test ? "testnext" : "checkbuild"}" ${full ? "" : "disabled"}>${s.test ? tx("הַמְשֵׁךְ") : tx("בְּדִיקָה")}</button></div>`}
      ${after}`;
    return tag + renderInstr(q, st) + stageHint(q, st) + body;
  }
  if (q.type === "punct") {
    const lines = q.lines.map((l, k) => {
      const m = st.pmarks ? (st.pmarks[k] ? " right" : " wrong") : "";
      return `<div class="pline"><span>${tx(l.t)}</span><button class="pslot${m}" data-pu="${k}" ${st.locked ? "disabled" : ""} aria-label="סימן פיסוק">${st.p[k] || ""}</button></div>`;
    }).join("");
    const full = st.p.every(Boolean);
    body = `<div class="${wait.trim()}"><span class="lbl-s">${tx("גְּעוּ בַּמִּשְׁבֶּצֶת כְּדֵי לְהַחְלִיף בֵּין . לְ־?")}</span><div class="plines">${lines}</div></div>
      ${st.locked || st.stage !== "do" ? "" : `<div class="row"><button class="btn" data-act="${s.test ? "testnext" : "checkpunct"}" ${full ? "" : "disabled"}>${s.test ? tx("הַמְשֵׁךְ") : tx("בְּדִיקָה")}</button></div>`}
      ${after}`;
    return tag + renderInstr(q, st) + stageHint(q, st) + body;
  }
  return "";
}

/* boards: words, letters, sentence, columns, scene. Marks are drawn on an SVG overlay. */
const colorOf = (st, id) => { const m = st && st.marks.find(m => m.t === "color" && m.id === id); return m ? COLORS[m.c].v : null; };
function clusters(word) { return word.match(/[א-ת][֑-ׇ]*|[^א-ת]+/g) || []; }
function renderBoard(q, st, live) {
  const b = q.board, marks = st.reveal ? q.expect : st.marks;
  const vm = { marks };
  const bg = id => { const c = colorOf(vm, id); return c ? ` style="background:${c}66;box-shadow:inset 0 0 0 2px ${c}"` : ""; };
  const tgt = (id, inner, cls = "tile") => `<span class="${cls}${st.pending === id ? " pend" : ""}" data-tgt="${id}"${live ? ' role="button" tabindex="0"' : ""}${bg(id)}>${inner}</span>`;
  let inner = "";
  if (b.kind === "words" || b.kind === "letters") inner = `<div class="tiles ${b.kind === "letters" ? "letters" : ""}">${b.items.map((w, k) => tgt("i" + k, b.kind === "letters" ? esc(w) : tx(w))).join("")}</div>`;
  else if (b.kind === "columns") inner = `<div class="cols"><div class="col">${b.a.map((w, k) => tgt("a" + k, tx(w))).join("")}</div><div class="col">${b.b.map((w, k) => tgt("b" + k, tx(w))).join("")}</div></div>`;
  else if (b.kind === "sentence") {
    const words = b.text.split(" ");
    inner = `<p class="sent">${words.map((w, wi) => {
      if (b.unit === "word") return tgt("w" + wi, tx(w));
      let li = 0;
      return `<span class="wd">${clusters(w).map(c => /^[א-ת]/.test(c) ? tgt(`w${wi}l${li++}`, tx(c), "lt") : esc(c)).join("")}</span>`;
    }).join(" ")}</p>`;
  }
  else if (b.kind === "scene") inner = sceneSVG(vm);
  return `<div class="board ${b.kind}${live ? "" : " still"}" id="board">${inner}<svg class="ov" id="ov" aria-hidden="true"></svg></div>`;
}

function sceneSVG(view) {
  const f = id => colorOf(view, id) || "#FFFFFF";
  const ink = 'stroke="#2B3550" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';
  const rays = Array.from({ length: 8 }, (_, k) => { const a = k * Math.PI / 4; return `M${(365 + 30 * Math.cos(a)).toFixed(1)} ${(48 + 30 * Math.sin(a)).toFixed(1)}L${(365 + 40 * Math.cos(a)).toFixed(1)} ${(48 + 40 * Math.sin(a)).toFixed(1)}`; }).join("");
  const cloud = "M0 0a14 14 0 0 1 8-24a18 18 0 0 1 32-4a14 14 0 0 1 14 28z";
  const petals = Array.from({ length: 5 }, (_, k) => { const a = k * 2 * Math.PI / 5 - Math.PI / 2; return `<circle cx="${(392 + 9 * Math.cos(a)).toFixed(1)}" cy="${(214 + 9 * Math.sin(a)).toFixed(1)}" r="6" fill="${f("flower")}" ${ink}/>`; }).join("");
  return `<svg class="scene-svg" viewBox="8 2 410 262" role="img" aria-label="תמונה: שמש, שני עננים, עץ עם ציפור, בית, ילדה, ילד, כדור, כלב ופרח">
    <rect width="420" height="280" fill="#FFFFFF"/>
    <path d="M0 222 Q110 214 210 222 T420 220" fill="none" ${ink}/>
    <g data-tgt="sun"><circle cx="365" cy="48" r="44" fill="transparent"/><path d="${rays}" fill="none" ${ink}/><circle cx="365" cy="48" r="22" fill="${f("sun")}" ${ink}/></g>
    <g><path transform="translate(185 64)" d="${cloud}" fill="#FFFFFF" ${ink}/></g>

/* overlay painter: hand-drawn circle, underline, X and connecting line */
function paintOverlay() {
  const b = $("#board"), ov = $("#ov");
  if (!b || !ov || !run || !run.q) return;
  const q = ST().questions[run.qi], st = run.q;
  const br = b.getBoundingClientRect();
  ov.setAttribute("viewBox", `0 0 ${br.width} ${br.height}`);
  const R = id => { const el = b.querySelector(`[data-tgt="${id}"]`); if (!el) return null; const r = el.getBoundingClientRect(); return { x: r.left - br.left, y: r.top - br.top, w: r.width, h: r.height }; };
  const marks = st.reveal ? q.expect : st.marks;
  let out = "";
  const seed = s => [...s].reduce((a, c) => a + c.charCodeAt(0), 0);
  const path = (d, col, extra = "") => `<path d="${d}" fill="none" stroke="${col}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  const ellipse = (r, sd, col, extra) => {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, rx = r.w / 2 + 8, ry = r.h / 2 + 6, st0 = -0.5 + (sd % 7) * 0.05;
    let d = "";
    for (let a = 0; a <= Math.PI * 2 + 0.45; a += 0.15) {
      const k = 1 + 0.045 * Math.sin(3 * a + sd) + (a > Math.PI * 2 ? 0.06 : 0);
      d += (d ? "L" : "M") + (cx + rx * k * Math.cos(a + st0)).toFixed(1) + " " + (cy + ry * k * Math.sin(a + st0)).toFixed(1);
    }
    return path(d, col, extra);
  };
  const edge = (r, tx_, ty_) => {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = tx_ - cx, dy = ty_ - cy;
    const s = Math.min((r.w / 2 + 4) / Math.abs(dx || 1e-6), (r.h / 2 + 4) / Math.abs(dy || 1e-6));
    return [cx + dx * s, cy + dy * s];
  };
  marks.forEach(m => {
    if (m.t === "color") return;
    const r = R(m.id); if (!r) return;
    const bad = !st.reveal && st.bad && st.bad.includes(mkey(m));
    const col = st.reveal ? "var(--good)" : bad ? "var(--oops)" : "var(--pen)";
    const sd = seed(m.id);
    if (m.t === "circle") out += ellipse(r, sd, col);
    if (m.t === "under") { const y = r.y + r.h + 2; out += path(`M${r.x + r.w + 2} ${y} Q${r.x + r.w / 2} ${y + 4} ${r.x - 2} ${y + 1}`, col); }
    if (m.t === "x") { const i = Math.min(r.w, r.h) * 0.12; out += path(`M${r.x + i} ${r.y + i}L${r.x + r.w - i} ${r.y + r.h - i}M${r.x + r.w - i} ${r.y + i}L${r.x + i} ${r.y + r.h - i}`, col); }
    if (m.t === "line") {
      const r2 = R(m.id2); if (!r2) return;
      const [x1, y1] = edge(r, r2.x + r2.w / 2, r2.y + r2.h / 2), [x2, y2] = edge(r2, r.x + r.w / 2, r.y + r.h / 2);
      out += path(`M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`, col) + `<circle cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" r="4" fill="${col}"/><circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="4" fill="${col}"/>`;
    }
  });
  if (st.pending && !st.reveal) { const r = R(st.pending); if (r) out += ellipse(r, 3, "var(--pen)", 'stroke-dasharray="6 6" opacity=".7"'); }
  ov.innerHTML = out;
}
window.addEventListener("resize", () => requestAnimationFrame(paintOverlay));

function tapTarget(id) {
  const s = ST(), q = s.questions[run.qi], st = run.q;
  if (q.type !== "mark" || st.locked || st.stage !== "do") return;
  st.bad = null; st.msg = null;
  if (!st.tool) { st.msg = "pick"; return draw(); }
  const toggle = m => { const k = mkey(m), i = st.marks.findIndex(x => mkey(x) === k); if (i >= 0) st.marks.splice(i, 1); else st.marks.push(m); };
  if (st.tool === "line") {
    if (!st.pending) st.pending = id;
    else if (st.pending === id) st.pending = null;
    else { toggle({ t: "line", id: st.pending, id2: id }); st.pending = null; }
  } else if (st.tool === "color") {
    if (!st.color) { st.msg = "pickColor"; return draw(); }
    const i = st.marks.findIndex(m => m.t === "color" && m.id === id);
    const same = i >= 0 && st.marks[i].c === st.color;
    if (i >= 0) st.marks.splice(i, 1);
    if (!same) st.marks.push({ t: "color", id, c: st.color });
  } else toggle({ t: st.tool, id });
  draw();
}

function checkMark() {
  const q = ST().questions[run.qi], st = run.q;
  st.tries++; st.pending = null;
  if (markOk(q, st.marks)) { st.locked = true; settle(st.tries === 1); chime(true); }
  else {
    chime(false);
    const exp = new Set(q.expect.map(mkey));
    st.bad = st.marks.map(mkey).filter(k => !exp.has(k));
    st.fbMsg = diagnose(q, st.marks);
    if (st.tries >= 2) { st.locked = true; st.reveal = true; settle(false); }
  }
  draw();
}
function buildWord(q, st) { return st.slots.map(i => q.bank[i]).join(""); }
function checkBuild() {
  const q = ST().questions[run.qi], st = run.q;
  st.tries++;
  if (buildWord(q, st) === q.word) { st.locked = true; settle(st.tries === 1); chime(true); }
  else {
    chime(false); st.hint = true;
    st.fbMsg = q.sentence ? "חַפְּשׂוּ אֶת הַמִּלָּה שֶׁמּוֹפִיעָה שָׁלוֹשׁ פְּעָמִים (סִמַּנְתִּי אוֹתָהּ בַּצָּהֹב), וְהַעְתִּיקוּ אוֹת אַחַר אוֹת." : `רֶמֶז: הָאוֹת הָרִאשׁוֹנָה הִיא ${q.word[0]}.`;
    st.slots = [];
    if (st.tries >= 2) { // show the right word
      const left = st.bank.slice(); st.slots = q.word.split("").map(ch => { const k = left.findIndex(i => q.bank[i] === ch); return left.splice(k, 1)[0]; });
      st.locked = true; settle(false);
    }
  }
  draw();
}
function checkPunct() {
  const q = ST().questions[run.qi], st = run.q;
  st.tries++;
  st.pmarks = q.lines.map((l, k) => st.p[k] === l.a);
  if (st.pmarks.every(Boolean)) { st.locked = true; settle(st.tries === 1); chime(true); }
  else {
    chime(false); st.fbMsg = "מִשְׁפָּט שֶׁשּׁוֹאֵל, נִגְמָר בְּ־?. מִשְׁפָּט שֶׁמְּסַפֵּר, נִגְמָר בְּ־.";
    if (st.tries >= 2) { st.p = q.lines.map(l => l.a); st.pmarks = q.lines.map(() => true); st.locked = true; settle(false); }
  }
  draw();
}

/* ---------- comprehension answers ---------- */
function settle(correctFirst) { run.res[run.qi] = correctFirst; }

function answerMC(oi) {
  const s = ST(), st = run.q;
  if (s.test) { st.sel = oi; return draw(); }
  st.tries++;
  if (oi === 0) { st.locked = true; settle(st.tries === 1); chime(true); }
  else { st.wrongs.push(oi); st.hint = true; chime(false);
    if (st.tries >= 2) { st.locked = true; settle(false); } }
  draw(); revealHint();
}
function checkFind() {
  const s = ST(), q = s.questions[run.qi], st = run.q;
  const sen = textFor(s, q).paras.flat()[st.picked];
  st.tries++;
  if (evMatch(sen, q.ev)) { st.locked = true; st.hint = true; st.picked = null; settle(st.tries === 1); chime(true); }
  else { chime(false); st.picked = null; if (st.tries >= 2) { st.locked = true; st.hint = true; settle(false); } }
  draw();
}
function checkOrder() {
  const q = ST().questions[run.qi], st = run.q;
  st.tries++;
  const marks = st.order.map((it, k) => it === k);
  if (marks.every(Boolean)) { st.locked = true; st.marks = marks; settle(st.tries === 1); chime(true); }
  else if (st.tries >= 2) { st.order = q.items.map((_, k) => k); st.pool = []; st.marks = st.order.map(() => true); st.locked = true; st.hint = true; settle(false); chime(false); }
  else {
    chime(false); st.hint = true;
    // keep the cards that are in place, send the others back to the pool
    const keep = []; st.marks = {};
    st.order.forEach((it, k) => { if (it === k) { keep[k] = it; st.marks[k] = true; } });
    st.pool = shuffle(st.order.filter((it, k) => it !== k));
    st.order = keep;
  }
  draw();
}

function nextQ() {
  const s = ST(), q = s.questions[run.qi], st = run.q;
  if (s.test) {   // store the test answer, score at the end
    if (isChoice(q)) run.ans[run.qi] = st.sel, run.res[run.qi] = st.sel === 0;
    if (q.type === "order") run.ans[run.qi] = st.order.slice(), run.res[run.qi] = st.order.every((it, k) => it === k);
    if (q.type === "mark") run.res[run.qi] = markOk(q, st.marks);
    if (q.type === "build") run.ans[run.qi] = buildWord(q, st), run.res[run.qi] = buildWord(q, st) === q.word;
    if (q.type === "punct") run.ans[run.qi] = st.p.slice(), run.res[run.qi] = q.lines.every((l, k) => st.p[k] === l.a);
  }
  if (q.type === "open") { run.res[run.qi] = "open"; run.open[q.q] = st.text.trim(); }
  if (run.qi + 1 < s.questions.length) { run.qi++; run.q = qStateNew(s.questions[run.qi], s); view = { name: "play" }; draw(); scrollTop(); }
  else finish();
}

function finish() {
  const s = ST();
  const scored = s.questions.map((q, i) => [q, run.res[i]]).filter(([q]) => q.type !== "open");
  const right = scored.filter(([, r]) => r === true).length;
  const stars = starsFor(scored.length ? right / scored.length : 1);
  const prev = S.st[s.id] || {};
  S.st[s.id] = {
    done: true, stars: Math.max(stars, prev.stars || 0), last: stars, when: Date.now(),
    first: Object.fromEntries(s.questions.map((q, i) => [i, run.res[i]])),
    open: Object.assign({}, prev.open || {}, run.open),
  };
  save();
  run.stars = stars; run.right = right; run.scored = scored.length;
  view = { name: "summary" }; draw(); scrollTop();
  if (stars >= 2) chime(true);
}

/* ---------- parents ---------- */
function skillStats() {
  const out = {};
  Object.keys(SKILLS).forEach(k => out[k] = { right: 0, n: 0 });
  ALL.forEach(s => {
    const r = S.st[s.id]; if (!r || !r.first) return;
    s.questions.forEach((q, i) => {
      if (q.type === "open") { if (r.first[i] === "open") { out.opinion.n++; out.opinion.right++; } return; }
      if (r.first[i] === true || r.first[i] === false) { out[q.skill].n++; if (r.first[i] === true) out[q.skill].right++; }
    });
  });
  return out;
}

    <section>
      <h3>ביצוע הוראות: החלק החשוב ביותר</h3>
      <p>חלק גדול מהמבדק הוא <b>ביצוע הוראות</b>: על אותיות, על מילים, על משפט ועל תמונה. ילדים שמבינים את הטקסט מפסידים כאן נקודות רק כי לא קראו את ההוראה עד הסוף. לכן מסלול ההוראות הוא הראשון באפליקציה.</p>
      <p><b>הטעויות הנפוצות:</b></p>
      <ul>
        <li>מסמנים יותר או פחות ממה שביקשו (ביקשו שלושה, הקיפו ארבעה).</li>
        <li>עושים פעולה אחרת (מותחים קו מתחת במקום להקיף).</li>
        <li>סופרים משמאל במקום מימין ("המילה השנייה", "האות הראשונה").</li>
        <li>בהוראה עם שני חלקים ("צבעו... ואחר כך מתחו קו...") עושים רק את הראשון.</li>
        <li>מעתיקים עם שינוי או שגיאה, במקום אות אחר אות.</li>
      </ul>
      <p style="margin-top:10px"><b>איך המסלול בנוי:</b> בתחנות הראשונות הילד נוגע קודם במילת הפעולה, ובתחנה 2 גם במילת המספר, ורק אחר כך מבצע. בהמשך העזרה הזו נעלמת, ובמבדק הדמה אין רמזים בכלל. הילד בוחר בעצמו כלי (עיגול, קו מתחת, X, קו מחבר, צבע), כך שאי אפשר להצליח בלי להבין את ההוראה.</p>
      <p style="margin-top:10px"><b>מילון ההוראות</b> (כדאי לתלות על המקרר):</p>
      <div class="verbs">${VERBS.map(([v, m]) => `<div><span class="vb">${v}</span><span>${m}</span></div>`).join("")}</div>
      <p style="margin-top:10px"><b>משחקים לבית:</b></p>
      <ul>
        <li><b>"המורה אומרת":</b> הוראות בעל פה עם מספר ומקום: "תביא שתי כפיות ומזלג אחד", "תשים את הספר השלישי על הכיסא".</li>
        <li><b>עיתון ועט:</b> "הקף שלוש מילים שמתחילות באות מ", "מתח קו מתחת למילה האחרונה בכותרת".</li>
        <li><b>הוראה בשני שלבים:</b> "קודם תסגור את הדלת, ואחר כך תדליק את האור". אחרי שהילד מצליח, עוברים לכתב.</li>
        <li><b>תגיד לי במילים שלך:</b> לפני כל דף עבודה, לבקש מהילד להסביר מה ההוראה מבקשת.</li>
      </ul>
    </section>

    ${opens.length ? `<section><h3>תשובות פתוחות שנכתבו</h3><p style="color:var(--ink-soft)">כדאי לקרוא יחד ולשאול: "האם הסברת למה? איפה בטקסט ראית את זה?"</p>
      <div class="review">${opens.map(o => `<div class="it open"><span class="a">${tx(o.s)}</span><span class="q">${tx(o.q)}</span><span class="a" style="color:var(--ink)">${esc(o.a)}</span></div>`).join("")}</div></section>` : ""}

    <section>
      <h3>מה בודק המבדק?</h3>
      <p>המבדק בודק אם הילד <b>מבין</b> את מה שהוא קורא ויודע לבצע הוראות כתובות. יש בו טקסט סיפורי, ביצוע הוראות, שאלות רב-ברירה (אמריקאיות), שאלות פתוחות שבהן כותבים תשובה, ומשימות ידע לשוני (משפחות מילים, הפכים, סימני פיסוק). הילד קורא לבד ועונה לבד.</p>
      <p>האפליקציה בנויה בהדרגה: בכל מסלול מתחילים ממשימה קטנה, וכל תחנה מוסיפה עוד קצת. התחנה האחרונה בכל מסלול היא מבדק דמה בלי רמזים.</p>
    </section>

    ${TRACKS.map(tr => `<section>
      <h3>${plain(tr.name)}: מה לומדים בכל תחנה</h3>
      ${tr.stations.map((s, i) => `<details><summary>תחנה ${i + 1}: ${plain(s.title)}${done(s) ? " ✓" : ""}</summary><p>${s.parent}</p></details>`).join("")}
    </section>`).join("")}

    <section>
      <h3>המיומנויות ואיך מתרגלים אותן בבית</h3>
      ${SKILL_ORDER.map(k => SKILLS[k]).map(sk => `<details><summary>${sk.name}</summary><p><b>מה זה:</b> ${sk.what}</p><p><b>בבית:</b> ${sk.home}</p><div class="ask">שאלה לשאול: "${sk.ask}"</div></details>`).join("")}
    </section>

    <section>
      <h3>ארגז הכלים של הילד</h3>
      <p>אלה האסטרטגיות שהאפליקציה חוזרת עליהן. כשהילד מתלבט, אפשר להזכיר אותן במקום לתת תשובה:</p>
      <ol>
        <li>קוראים את ההוראה פעמיים. מה עושים? על מה? כמה? איפה?</li>
        <li>קוראים את <b>כל</b> הטקסט לפני השאלות.</li>
        <li>קוראים את השאלה עד הסוף, ואת <b>כל</b> התשובות, גם אחרי שנראה שמצאנו.</li>
        <li>חוזרים לטקסט ומחפשים מילה מהשאלה. מותר וחכם לחזור!</li>
        <li>בשאלה פתוחה: מתחילים במילים מהשאלה ומוסיפים "כי...".</li>
      </ol>
    </section>

    <section>
      <h3>טיפים לעבודה משותפת</h3>
      <ul>
        <li><b>קצר וקבוע:</b> תחנה אחת ביום, 10 עד 15 דקות. עדיף כל יום קצת מאשר הרבה פעם בשבוע.</li>
        <li><b>לא לתת תשובות:</b> במקום "זו תשובה ב'", לשאול "מה ההוראה ביקשה?" או "איפה זה כתוב?".</li>
        <li><b>לשבח מאמץ ואסטרטגיה:</b> "ראיתי שקראת את ההוראה פעמיים, מצוין!" עדיף על "אתה חכם".</li>
        <li><b>טעות היא רמז:</b> אחרי טעות האפליקציה אומרת מה בדיוק לא התאים להוראה (פעולה, כמות, צבע, מקום). תנו לילד לנסות שוב לבד.</li>
        <li><b>הקראה:</b> כפתור הרמקול מקריא את ההוראה. הוא עוזר בהתחלה, אבל במבדק הילד קורא לבד, אז כדאי להפחית בו בהדרגה.</li>
        <li><b>ניקוד:</b> הטקסטים מנוקדים. ילד שקורא בשטף יכול לנסות גם בלי ניקוד (כפתור "ניקוד" למעלה).</li>
        <li><b>לחזור על תחנות:</b> אפשר לשחק כל תחנה שוב. סדר התשובות מתערבב בכל פעם.</li>
      </ul>
    </section>

    <section>
      <h3>הגדרות</h3>
      <div class="danger-zone">
        <button class="btn ghost" data-act="unlockAll">${S.unlockAll ? "נעילת תחנות לפי הסדר" : "פתיחת כל התחנות"}</button>
        <button class="btn ghost" data-act="askReset">איפוס ההתקדמות</button>
      </div>
      <div id="confirmZone"></div>
    </section>
    <div class="row"><button class="btn" data-go="home">חזרה למסע</button></div>
  </div>`;
}

/* ---------- draw + events ---------- */
function draw() {
  document.documentElement.style.setProperty("--read-size", [1.35, 1.6, 1.9][S.size - 1] + "rem");
  const R = $("#root");
  R.innerHTML = view.name === "home" ? renderHome() : view.name === "intro" ? renderIntro() : view.name === "play" ? renderPlay()
    : view.name === "summary" ? renderSummary() : renderParents();
  if (view.name === "play") requestAnimationFrame(paintOverlay);
}
function scrollTop() { try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); } }
function revealHint() {
  const el = document.querySelector(".sen.hl");
  if (el && window.matchMedia("(max-width: 860px)").matches) el.scrollIntoView({ behavior: "smooth", block: "center" });
}
function go(name) { view = { name }; draw(); scrollTop(); }
function startStation(t, i) { run = { t, i, qi: 0, res: {}, ans: {}, open: {}, q: null }; view = { name: "intro" }; draw(); scrollTop(); }

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-sen], [data-tgt], [data-iw]"); if (!t) return;
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.say) return speak(d.say);
  if (d.track !== undefined) { S.track = +d.track; save(); return draw(); }
  if (d.station !== undefined) {
    const i = +d.station, tr = S.track || 0;
    if (!unlocked(tr, i)) return toast("קודם מסיימים את התחנה הקודמת");
    return startStation(tr, i);
  }
  if (view.name !== "play" && d.act === undefined) return;
  if (d.iw !== undefined) return tapInstrWord(+d.iw);
  if (d.tgt !== undefined) return tapTarget(d.tgt);
  if (d.tool) { const st = run.q; st.tool = st.tool === d.tool ? null : d.tool; st.pending = null; st.msg = null; return draw(); }
  if (d.color) { run.q.color = d.color; run.q.msg = null; return draw(); }
  if (d.bk !== undefined) { const st = run.q, q = ST().questions[run.qi]; if (st.slots.length < q.word.length) st.slots.push(+d.bk); st.fbMsg = null; return draw(); }
  if (d.bs !== undefined) { run.q.slots.splice(+d.bs, 1); return draw(); }
  if (d.pu !== undefined) { const st = run.q, k = +d.pu; st.p[k] = st.p[k] === "." ? "?" : "."; if (st.pmarks) st.pmarks = null; return draw(); }
  if (d.opt !== undefined) return answerMC(+d.opt);
  if (d.sen !== undefined) {
    const q = ST().questions[run.qi];
    if (q.type === "find" && !run.q.locked) { run.q.picked = +d.sen; draw(); }
    return;
  }
  if (d.order !== undefined) { const st = run.q, i = +d.order; st.pool = st.pool.filter(x => x !== i); const k = firstEmpty(st.order); st.order[k] = i; if (st.marks) delete st.marks[k]; return draw(); }
  if (d.unorder !== undefined) { const st = run.q, k = +d.unorder; if (st.marks && st.marks[k]) return; st.pool.push(st.order[k]); delete st.order[k]; st.order = compact(st.order, st.marks); return draw(); }
  switch (d.act) {
    case "nikud": S.nikud = !S.nikud; save(); return draw();
    case "size": S.size = S.size % 3 + 1; save(); return draw();
    case "sound": S.sound = !S.sound; save(); return draw();
    case "start": run.qi = 0; run.q = qStateNew(ST().questions[0], ST()); view = { name: "play" }; draw(); return scrollTop();
    case "next": case "testnext": return nextQ();
    case "checkfind": return checkFind();
    case "checkorder": return checkOrder();
    case "checkmark": return checkMark();
    case "checkbuild": return checkBuild();
    case "checkpunct": return checkPunct();
    case "clearMarks": run.q.marks = []; run.q.pending = null; run.q.bad = null; return draw();
    case "openDone": run.q.showModel = true; chime(true); return draw();
    case "nextStation": return startStation(run.t, run.i + 1);
    case "again": return startStation(run.t, run.i);
    case "unlockAll": S.unlockAll = !S.unlockAll; save(); toast(S.unlockAll ? "כל התחנות פתוחות" : "התחנות נפתחות לפי הסדר"); return draw();
    case "askReset":
      $("#confirmZone").innerHTML = `<div class="confirm" style="margin-top:10px"><span>למחוק את כל הכוכבים והתשובות בדפדפן הזה?</span><button class="btn" style="background:var(--oops)" data-act="doReset">כן, למחוק</button><button class="btn ghost" data-act="noReset">ביטול</button></div>`; return;
    case "noReset": $("#confirmZone").innerHTML = ""; return;
    case "doReset": { const keep = { nikud: S.nikud, size: S.size, sound: S.sound }; S = Object.assign(blank(), keep); save(); toast("ההתקדמות אופסה"); return draw(); }
  }
});
// order slots: fill the first empty position; when a card is removed, keep confirmed (green) cards in place
function firstEmpty(arr) { let k = 0; while (arr[k] !== undefined) k++; return k; }
function compact(order, marks) {
  const out = []; const loose = [];
  order.forEach((it, k) => { if (it === undefined) return; if (marks && marks[k]) out[k] = it; else loose.push(it); });
  let k = 0; loose.forEach(it => { while (out[k] !== undefined) k++; out[k] = it; });
  return out;
}
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"]:not(button)')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e => {
  const c = e.target.closest("[data-check]"); if (!c) return;
  const k = +c.dataset.check, st = run.q;
  st.checked = c.checked ? [...st.checked, k] : st.checked.filter(x => x !== k);
});
document.addEventListener("input", e => {
  if (e.target.dataset.input !== "open") return;
  run.q.text = e.target.value;
  const btn = document.querySelector('[data-act="openDone"], [data-act="testnext"]');
  if (btn) btn.disabled = run.q.text.trim().length < 3;
});
document.addEventListener("submit", e => {
  if (e.target.id !== "nameForm") return;
  e.preventDefault();
  S.name = $("#kidName").value.trim().slice(0, 20); save(); draw(); toast(S.name ? "נעים מאוד, " + S.name + "!" : "השם נמחק");
});
if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }

if (location.hash === "#parents") view = { name: "parents" };
draw();
</script>
