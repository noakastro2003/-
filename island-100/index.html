<script>
/* the host adds a floating "Powered by Netlify" badge: everything on the page that is not the game is removed */
(function () {
  var keep = { space: 1, sky: 1, fx: 1, toast: 1 };
  function ours(el) { return el.tagName === "SCRIPT" || el.tagName === "STYLE" || el.tagName === "LINK" || keep[el.id] || (el.classList && el.classList.contains("app")); }
  function sweep() {
    Array.prototype.slice.call(document.body ? document.body.children : []).forEach(function (el) { if (!ours(el)) el.remove(); });
    Array.prototype.slice.call(document.documentElement.children).forEach(function (el) { if (el.tagName !== "HEAD" && el.tagName !== "BODY") el.remove(); });
  }
  new MutationObserver(sweep).observe(document.documentElement, { childList: true, subtree: false });
  if (document.body) new MutationObserver(sweep).observe(document.body, { childList: true });
  sweep(); addEventListener("DOMContentLoaded", function () { sweep(); new MutationObserver(sweep).observe(document.body, { childList: true }); }); addEventListener("load", sweep);
  setInterval(sweep, 2000);
})();
</script>
