<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>הכיתה שלי · למורה המחליפה</title>
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face { font-family: 'Heebo'; font-weight: 400; src: url(fonts/heebo-hebrew-400-normal.woff2) format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: 'Heebo'; font-weight: 500; src: url(fonts/heebo-hebrew-500-normal.woff2) format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: 'Heebo'; font-weight: 400; src: url(fonts/heebo-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
:root { --bg: #F6F0E8; --card: #FFFAF3; --ink: #3B2A4A; --soft: rgba(59, 42, 74, .6); --plum: #5B4190; --line: rgba(74, 53, 102, .08);
  --clay: 0 14px 26px -16px rgba(96, 70, 44, .35), 0 2px 5px -2px rgba(96, 70, 44, .1), inset 0 2px 1px rgba(255, 255, 255, .95), inset 0 -4px 8px rgba(122, 92, 60, .1); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 Heebo, system-ui, sans-serif; padding: max(18px, env(safe-area-inset-top)) 16px 40px; }
main { max-width: 640px; margin: 0 auto; }
.hero { text-align: center; margin: 10px 0 18px; }
.hero img { width: 120px; height: 120px; object-fit: contain; filter: drop-shadow(0 10px 12px rgba(96, 70, 44, .25)); }
h1 { font-size: 26px; font-weight: 500; margin: 6px 0 2px; }
.sub { color: var(--soft); }
.card { background: var(--card); border-radius: 26px; padding: 16px 18px; margin: 14px 0; box-shadow: var(--clay); }
.card h2 { font-size: 17px; margin: 0 0 8px; color: var(--plum); }
.notes { background: #FFF6DA; white-space: pre-wrap; }
.les { display: grid; grid-template-columns: 62px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.les:first-of-type { border-top: 0; }
.tm { font-weight: 500; color: var(--plum); font-variant-numeric: tabular-nums; }
.tm small { display: block; color: var(--soft); font-weight: 400; font-size: 12px; }
.les b { font-size: 16.5px; }
.les .st { color: var(--soft); font-size: 14px; }
.sec { margin: 6px 0 0; font-size: 14.5px; }
.sec i { font-style: normal; font-weight: 500; color: var(--plum); }
.mat { margin: 6px 0 0; padding: 0 18px 0 0; font-size: 14px; }
.lk { display: inline-flex; align-items: center; gap: 6px; margin: 8px 0 0 8px; padding: 6px 12px; border-radius: 99px; background: #EEE4F6; color: var(--plum); text-decoration: none; font-size: 14px; }
.kids { display: flex; flex-wrap: wrap; gap: 8px; }
.kids span { padding: 6px 12px; border-radius: 99px; background: #fff; box-shadow: var(--clay); font-size: 14px; }
.board { margin: 0 auto 12px; width: 60%; text-align: center; padding: 6px; border-radius: 99px; background: var(--plum); color: #fff; font-size: 13px; }
.seats { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 8px 4px; }
.seat { min-height: 40px; display: grid; place-items: center; border-radius: 12px; background: #fff; box-shadow: var(--clay); font-size: 12px; text-align: center; padding: 3px; overflow-wrap: anywhere; }
.seat.e { background: transparent; box-shadow: inset 0 2px 5px rgba(96, 70, 44, .15); }
.seat.g { background: none; box-shadow: none; }
.foot { text-align: center; color: var(--soft); font-size: 13px; margin-top: 20px; }
.msg { text-align: center; margin-top: 30vh; color: var(--soft); }
</style>
</head>
<body>
<main id="m"><p class="msg">טוענת…</p></main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const t = new URLSearchParams(location.search).get('t') || '';
fetch('/api/sub?op=get&t=' + encodeURIComponent(t)).then(r => r.json()).then(({ data: D, exp, error }) => {
  const m = document.getElementById('m');
  if (error || !D) { m.innerHTML = '<p class="msg">הקישור הזה כבר לא פעיל.<br>אפשר לבקש מהמורה קישור חדש 🙂</p>'; return; }
  const P = D.periods || [];
  let h = `<div class="hero"><img src="img/ill/dark/school.webp" alt=""><h1>תודה על ההחלפה היום!</h1><div class="sub">${esc(D.cls || '')}${D.cls ? ' · ' : ''}${esc(D.day || '')}${D.teacher ? ' · הכיתה של ' + esc(D.teacher) : ''}</div></div>`;
  if (D.notes) h += `<div class="card notes"><h2>חשוב לדעת</h2>${esc(D.notes)}</div>`;
  h += `<div class="card"><h2>מערכת היום</h2>${P.length ? P.map(p => `<div class="les"><div class="tm">${esc(p.start || '')}${p.end ? `<small>עד ${esc(p.end)}</small>` : ''}</div><div>
    <b>${esc(p.title)}</b>${p.subtitle ? `<div class="st">${esc(p.subtitle)}</div>` : ''}
    ${(p.sections || []).filter(s => s.text).map(s => `<p class="sec">${s.label ? `<i>${esc(s.label)}:</i> ` : ''}${esc(s.text)}</p>`).join('')}
    ${(p.materials || []).length ? `<ul class="mat">${p.materials.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${(p.links || []).filter(l => /^https?:/.test(l.url)).map(l => `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">📎 ${esc(l.text || 'קובץ')}</a>`).join('')}
  </div></div>`).join('') : '<p class="sub">אין שיעורים רשומים ליום הזה.</p>'}</div>`;
  if (D.seats) { const S = D.seats, set = new Set(S.desks || []), c = []; for (let r = 0; r < S.gh; r++) for (let k = 0; k < S.gw; k++) { const key = r + '-' + k, n = (S.map || {})[key]; c.push(set.has(key) ? `<div class="seat ${n ? '' : 'e'}">${esc(n || '')}</div>` : '<div class="seat g"></div>'); }
    h += `<div class="card"><h2>מקומות ישיבה</h2><div class="board">הלוח</div><div class="seats" style="--cols:${S.gw}">${c.join('')}</div></div>`; }
  if (D.kids && D.kids.length) h += `<div class="card"><h2>הילדים בכיתה (${D.kids.length})</h2><div class="kids">${D.kids.map(n => `<span>${esc(n)}</span>`).join('')}</div></div>`;
  h += `<p class="foot">הקישור פעיל עד ${new Date(exp).toLocaleString('he-IL', { weekday: 'long', hour: '2-digit', minute: '2-digit' })} · נוצר באפליקציה "הכיתה שלי"</p>`;
  m.innerHTML = h;
}).catch(() => { document.getElementById('m').innerHTML = '<p class="msg">אין חיבור לאינטרנט – נסו שוב בעוד רגע.</p>'; });
</script>
</body>
</html>
